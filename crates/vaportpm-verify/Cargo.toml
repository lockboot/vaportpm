[package]
name = "vaportpm-verify"
version = "0.3.0"
edition = "2021"
description = "Cloud vTPM attestation verification - TPM and Nitro attestation verification"
license.workspace = true

[dependencies]
vaportpm-attest = { path = "../vaportpm-attest" }

# X.509 parsing. The shared deps are no_std-base in the workspace (for vaportpm-attest's
# UEFI build); vaportpm-verify is a std crate, so it opts each back into `std`.
der = { workspace = true, features = ["std"] }
spki = { workspace = true }
x509-cert = { workspace = true, features = ["std", "builder", "hazmat"] }

# Time types
pki-types = { workspace = true }

# Signature verification
p256 = { workspace = true }
p384 = { workspace = true }
ecdsa = { workspace = true }
rsa = { workspace = true }

# COSE/CBOR for Nitro
coset = { workspace = true }
ciborium = { workspace = true, features = ["std"] }

# Common
sha2 = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
zerocopy = { workspace = true }

[dev-dependencies]
# Test certificates are built with x509-cert's `builder` (a workspace dep) + p256/p384 signers, so
# no `ring`/`rcgen` in the tree. rand_core (getrandom) supplies OsRng for ephemeral test keys.
p256 = { workspace = true, features = ["pkcs8"] }
p384 = { workspace = true, features = ["pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lib]
name = "vaportpm_verify"
path = "src/lib.rs"

[[bin]]
name = "vaportpm-verify"
path = "src/bin/verify.rs"
